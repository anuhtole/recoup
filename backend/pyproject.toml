[project]
name = "recoup"
version = "0.1.0"
description = "An AI agent that finds money a company is owed and drafts the recovery for human approval."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1,<2",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
recoup = "recoup.cli:main"

[dependency-groups]
dev = [
    "httpx2",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recoup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["src"]
addopts = "-q"
