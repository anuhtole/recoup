name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recoup
          POSTGRES_PASSWORD: recoup
          POSTGRES_DB: recoup
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Use Postgres
        if: matrix.database == 'postgres'
        run: |
          echo "RECOUP_DATABASE_URL=postgresql+psycopg://recoup:recoup@localhost:5432/recoup" >> "$GITHUB_ENV"
          echo "RECOUP_TEST_DATABASE_URL=postgresql+psycopg://recoup:recoup@localhost:5432/recoup" >> "$GITHUB_ENV"
      - name: Migrations match models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Synthetic dataset matches the generator
        if: matrix.database == 'sqlite'
        run: uv run recoup generate && git diff --exit-code -- ../data
      - name: Tests, red-team, and eval quality gates
        run: uv run pytest --cov=recoup --cov-report=term
      - name: Eval report
        run: uv run python -m evals.run
      - name: Eval results are up to date
        if: matrix.database == 'sqlite'
        run: git diff --exit-code -- evals/results

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
